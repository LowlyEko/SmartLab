<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLab</title>
    <link rel="stylesheet" href="login/login-register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="container">

        <!-- ── LOGIN FORM ──────────────────────────────────────── -->
        <div class="form-box login">
            <form>
                <h1>Login</h1>
                <p class="form-subtitle">Sign in to your account</p>
                <div class="section-label">Login as Administrator</div>

                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required id="login-password">
                    <i class="fa-solid fa-lock"></i>
                    <img src="needs/eye-slash-solid.png" id="login-eyeicon">
                </div>

                <div class="options-row">
                    <label class="checkbox-label">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <div id="login-error" class="error-msg"></div>

                <button type="submit" class="btn-primary">Login as administrator</button>

                <div class="divider">Student Sign in with</div>

                <div id="google-error" class="error-msg"></div>

                <a href="/SmartLab/auth/google-login.php" class="btn-google"><span class="google-logo"></span>Google</a>
            </form>
        </div>

        <!-- ── REGISTER FORM ───────────────────────────────────── -->
        <div class="form-box register">
            <form style="width:100%;">
                <h1>Register</h1>

                <!-- Personal Details -->
                <div class="divider1">Personal Details</div>

                <div class="input-box1">
                    <input type="text" placeholder="First Name" required name="first_name">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box1">
                    <input type="text" placeholder="Last Name" required name="last_name">
                    <i class="fa-solid fa-user"></i>
                </div>

                <!-- Account Details -->
                <div class="divider1">Account Details</div>

                <div class="input-box1">
                    <input type="email" placeholder="Email" required name="email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box1">
                    <input type="password" placeholder="Password" required id="register-password" name="password">
                    <i class="fa-solid fa-lock"></i>
                    <img src="needs/eye-slash-solid.png" id="register-eyeicon">
                </div>

                <!-- Role & Position -->
                <div class="divider1">Role &amp; Position</div>

                <div class="input-box1 select-box">
                    <select name="user_type" required id="register-user-type">
                        <option value="" disabled selected>Select Role</option>
                        <option value="laboratory_staff">Laboratory Staff</option>
                        <option value="laboratory_chemist">Laboratory Chemist</option>
                    </select>
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <div class="agree-row">
                    <input type="checkbox" id="agree">
                    <label for="agree">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <div id="register-error" class="error-msg"></div>

                <button type="submit" class="btn-primary1">Register</button>
            </form>
        </div>

        <!-- ── TOGGLE PANEL ───────────────────────────────────── -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <div class="welcome-row">
                    <div class="logo-ring">
                        <img src="needs/CAS Logo.png" alt="">
                    </div>
                    <div class="welcome-text">
                        <h2>Welcome to</h2>
                        <h1>SmartLab</h1>
                    </div>
                </div>
                <p class="subtitle">Your Gateway to Smart <br>SmartLab Reservations</p>
                <p class="tagline">Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <div class="welcome-row">
                    <div class="logo-ring">
                        <img src="needs/CAS Logo.png" alt="">
                    </div>
                    <div class="welcome-text">
                        <h2>Welcome to</h2>
                        <h1>SmartLab</h1>
                    </div>
                </div>
                <p class="tagline">Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>

    </div><!-- /.container -->

    <script src="login/login-register.js"></script>
</body>
</html>
