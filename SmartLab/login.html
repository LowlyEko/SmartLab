<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASLaboratory - Staff Login</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 10%, rgba(17,255,85,0.10) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 90%, rgba(152,158,45,0.10) 0%, transparent 50%),
                  #f4f7f4;
    }

    .login-container {
      display: flex;
      width: 860px;
      min-height: 520px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* Left panel */
    .panel-left {
      width: 42%;
      background: linear-gradient(145deg, #1a4d2e, #205e38);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 36px;
      color: white;
      text-align: center;
    }
    .panel-left .logo-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.95;
    }
    .panel-left h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .panel-left h1 span { color: #7ddb9e; }
    .panel-left p {
      font-size: 13px;
      opacity: 0.75;
      line-height: 1.6;
      margin-top: 10px;
    }
    .panel-left .divider {
      width: 40px;
      height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      margin: 20px auto;
    }
    .panel-left .role-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }
    .role-badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 500;
    }

    /* Right panel */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 44px;
    }
    .panel-right h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }
    .panel-right .subtitle {
      font-size: 13px;
      color: #718096;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap { position: relative; }
    .input-wrap i.icon-left {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: #a0aec0; font-size: 18px;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 12px 11px 40px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #205e38;
      box-shadow: 0 0 0 3px rgba(32,94,56,0.10);
    }
    .eye-toggle {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #a0aec0; font-size: 18px;
    }

    .error-msg {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #205e38;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover { background: #174d2e; }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { background: #a0aec0; cursor: not-allowed; }

    .footer-note {
      text-align: center;
      color: #a0aec0;
      font-size: 12px;
      margin-top: 20px;
    }

    .switch-portal {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.30);
      color: white;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .switch-portal:hover {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.5);
    }

    @media (max-width: 700px) {
      .login-container { flex-direction: column; width: 95%; }
      .panel-left { width: 100%; padding: 30px 24px; }
      .panel-right { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <div class="login-container">

    <!-- Left branding panel -->
    <div class="panel-left">
      <div class="logo-icon"><i class='bx bx-flask'></i></div>
      <h1>CAS<span>Laboratory</span></h1>
      <div class="divider"></div>
      <p>Staff & Administrator Portal<br>Manage reservations, inventory, and accountability records.</p>
      <div class="role-badges">
        <span class="role-badge">Lab Staff</span>
        <span class="role-badge">Chemist</span>
        <span class="role-badge">Admin</span>
      </div>
      <a href="../student/login.html" class="switch-portal">
        <i class='bx bx-transfer'></i> Switch to Student Portal
      </a>
    </div>

    <!-- Right form panel -->
    <div class="panel-right">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in with your staff credentials to continue.</p>

      <div class="error-msg" id="error-msg"></div>

      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class='bx bx-user icon-left'></i>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class='bx bx-lock-alt icon-left'></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <i class='bx bx-hide eye-toggle' id="eye-toggle"></i>
        </div>
      </div>

      <button class="btn-login" id="login-btn" onclick="handleLogin()">Sign In</button>

      <div class="footer-note">Student? Use the <a href="../student/login.html" style="color:#205e38;">Student Portal</a> instead.</div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";

    // Redirect if already logged in as staff
    const token = localStorage.getItem("smartlab_admin_token");
    if (token) window.location.href = "dashboard.html";

    // Password toggle
    document.getElementById("eye-toggle").addEventListener("click", function () {
      const input = document.getElementById("password");
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      this.className = isHidden ? "bx bx-show eye-toggle" : "bx bx-hide eye-toggle";
    });

    // Enter key support
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });

    async function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      const errorEl = document.getElementById("error-msg");

      errorEl.style.display = "none";

      if (!username || !password) {
        showError("Please enter your username and password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          const user = data.data.user;
          const allowedRoles = ["LABORATORY_STAFF", "LABORATORY_CHEMIST", "ADMIN"];

          if (!allowedRoles.includes(user.user_type)) {
            showError("Access denied. This portal is for staff only. Use the Student Portal.");
            return;
          }

          // Use separate storage keys from student side to avoid conflicts
          localStorage.setItem("smartlab_admin_token", data.data.token);
          localStorage.setItem("smartlab_admin_user", JSON.stringify(user));
          window.location.href = "dashboard.html";
        } else {
          showError(data.message || "Invalid username or password.");
        }
      } catch (err) {
        showError("Could not connect to the server. Please try again.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
