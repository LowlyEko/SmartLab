<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAS Laboratory – Staff Login</title>
  <link rel="stylesheet" href="login-register.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

  <div class="container" id="container">

    <!-- ===== LOGIN FORM ===== -->
    <div class="form-box login">
      <form id="loginForm">
        <h1>Welcome Back</h1>
        <p class="form-subtitle">Sign in to your staff account</p>

        <div id="login-error" style="display:none; background:#fff0f0; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-bottom:12px;"></div>

        <div class="input-box">
          <input type="text" id="login-username" placeholder="Username or Email" required>
          <i class='bx bx-user'></i>
        </div>

        <div class="input-box">
          <input type="password" id="login-password" placeholder="Password" required>
          <img src="eye-slash-solid.png" id="login-eyeicon" alt="toggle password">
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me"> Remember me
          </label>
          <span class="forgot-link"><a href="#">Forgot password?</a></span>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">Sign In</button>

        <div style="display:flex; align-items:center; gap:10px; margin:16px 0 4px;">
          <hr style="flex:1; border:none; border-top:1px solid #ddd;">
          <span style="color:#aaa; font-size:0.8rem; white-space:nowrap;">Student? Sign in with Google</span>
          <hr style="flex:1; border:none; border-top:1px solid #ddd;">
        </div>

        <div id="google-error" style="display:none; background:#fff0f0; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-bottom:8px;"></div>

        <div id="g_id_onload"
          data-client_id="596806363130-117mkd7fdb0b35cnr42iipuo08b8ccck.apps.googleusercontent.com"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-theme="outline"
          data-text="signin_with"
          data-shape="rectangular"
          data-logo_alignment="left"
          data-width="300">
        </div>
      </form>
    </div>

    <!-- ===== REGISTER FORM ===== -->
    <div class="form-box register">
      <form id="registerForm">
        <h1>Create Account</h1>
        <p class="form-subtitle">Register a new staff account</p>

        <div id="register-error" style="display:none; background:#fff0f0; color:#c0392b; border:1px solid #f5c6cb; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-bottom:8px;"></div>
        <div id="register-success" style="display:none; background:#f0fff4; color:#276749; border:1px solid #9ae6b4; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-bottom:8px;"></div>

        <div style="display:flex; gap:8px;">
          <div class="input-box1" style="flex:1;">
            <input type="text" id="reg-firstname" placeholder="First Name" required>
            <i class='bx bx-user'></i>
          </div>
          <div class="input-box1" style="flex:1;">
            <input type="text" id="reg-lastname" placeholder="Last Name" required>
          </div>
        </div>

        <div class="input-box1">
          <input type="text" id="reg-username" placeholder="Username" required>
          <i class='bx bx-at'></i>
        </div>

        <div class="input-box1">
          <input type="email" id="reg-email" placeholder="Email address" required>
          <i class='bx bx-envelope'></i>
        </div>

        <div class="input-box1">
          <input type="password" id="register-password" placeholder="Password (min 8 chars + numbers)" required>
          <img src="eye-slash-solid.png" id="register-eyeicon" alt="toggle password">
        </div>

        <div class="agree-row">
          <input type="checkbox" id="agree-terms" required>
          <label for="agree-terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>

        <button type="submit" class="btn-primary1" id="register-btn">Create Account</button>
      </form>
    </div>

    <!-- ===== TOGGLE PANELS ===== -->
    <div class="toggle-box">

      <div class="toggle-panel toggle-left">
        <div class="welcome-row">
          <div class="logo-ring">
            <img src="CAS Logo.png" alt="CAS Logo" onerror="this.style.display='none'">
          </div>
          <div class="welcome-text">
            <h1>SmartLab</h1>
            <h2>CAS Laboratory System</h2>
          </div>
        </div>
        <p class="subtitle">New staff member?<br>Create your account here.</p>
        <button class="btn register-btn">Register</button>
      </div>

      <div class="toggle-panel toggle-right">
        <div class="welcome-row">
          <div class="logo-ring">
            <img src="CAS Logo.png" alt="CAS Logo" onerror="this.style.display='none'">
          </div>
          <div class="welcome-text">
            <h1>SmartLab</h1>
            <h2>CAS Laboratory System</h2>
          </div>
        </div>
        <p class="subtitle">Already have an account?<br>Sign in here.</p>
        <button class="btn login-btn">Login</button>
      </div>

    </div>

  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="login-register.js"></script>
</body>
</html>
