<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations - CAS Laboratory</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    /* --- Modal & Layout Styles --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 95%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* --- Equipment Checklist Grid (Monitoring Log Style) --- */
    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #eef0f2;
      margin-top: 10px;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checklist-item input {
      width: 18px; height: 18px;
      cursor: pointer;
      accent-color: #27ae60;
    }

    /* --- Dynamic Row Styles (Materials & Members) --- */
    .dynamic-list-container {
      margin-top: 10px;
      border: 1px dashed #cbd5e0;
      padding: 12px;
      border-radius: 8px;
    }
    .dynamic-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .btn-add-small {
      background: #27ae60;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-remove {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    .section-title { font-weight: 700; font-size: 1rem; color: #2d3748; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo"><i class='bx bx-flask'></i> <span>CASLaboratory</span></div>
    <div class="nav-menu">
      <a href="index.html"><i class='bx bx-home'></i> Dashboard</a>
      <a href="reservations.html" class="active"><i class='bx bx-calendar'></i> Reservations</a>
      <a href="inventory.html"><i class='bx bx-package'></i> Inventory</a>
      <a href="accountability.html"><i class='bx bx-clipboard'></i> Accountability</a>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h1>Reservations</h1>
      <button class="btn-add" onclick="openNewReservationModal()">
        <i class='bx bx-plus'></i> New Request
      </button>
    </div>

    <div class="card">
      <div class="table-header-bar">
        <h2>My Reservation History</h2>
        <span id="table-meta">Syncing with server...</span>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Date Needed</th>
            <th>Time</th>
            <th>Activity</th>
            <th>Items</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reservations-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="new-res-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color: #2c3e50;">Lab Reservation Form</h2>
        <span onclick="closeModal()" style="cursor:pointer; font-size:24px;">&times;</span>
      </div>

      <form id="new-reservation-form">
        <div class="form-row">
          <div class="form-group">
            <label>Date Needed *</label>
            <input type="date" id="date-needed" required>
          </div>
          <div class="form-group">
            <label>Group # (Optional)</label>
            <input type="text" id="group-number" placeholder="e.g. Group 1">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Time *</label>
            <input type="time" id="time-start" required>
          </div>
          <div class="form-group">
            <label>End Time *</label>
            <input type="time" id="time-end" required>
          </div>
        </div>

        <div class="form-group">
          <label>Activity / Experiment Title *</label>
          <input type="text" id="activity-title" placeholder="e.g. Acid-Base Titration" required>
        </div>

        <hr>

        <div class="form-group">
          <label class="section-title"><i class='bx bx-list-check'></i> Equipment Monitoring Log</label>
          <p style="font-size: 0.75rem; color: #718096; margin-bottom: 8px;">Check common equipment to use during activity.</p>
          <div id="equipment-checklist" class="checklist-grid">
            </div>
        </div>

        <div class="form-group" style="margin-top: 25px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="section-title"><i class='bx bx-test-tube'></i> Materials & Glassware</label>
            <button type="button" class="btn-add-small" onclick="addItemRow()">+ Add Material</button>
          </div>
          <div id="materials-container" class="dynamic-list-container">
            </div>
        </div>

        <hr>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="section-title"><i class='bx bx-group'></i> Group Members</label>
            <button type="button" class="btn-add-small" onclick="addMemberRow()">+ Add Member</button>
          </div>
          <div id="members-container" class="dynamic-list-container">
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
          <label>Special Notes / Instructions</label>
          <textarea id="conditions-note" rows="2" placeholder="e.g. Need extra ice bucket..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/guard.js"></script>
  <script type="module" src="js/reservation.js"></script>
</body>
</html>
