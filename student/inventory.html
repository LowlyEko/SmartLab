<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLab - Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">CASLaboratory</div>
    <div class="nav-menu">
      <a href="index.html"><i class='bx bx-home'></i> Dashboard</a>
      <a href="reservations.html"><i class='bx bx-calendar'></i> Reservations</a>
      <a href="inventory.html" class="active"><i class='bx bx-package'></i> Inventory</a>
      <a href="accountability.html"><i class='bx bx-error-alt'></i> Accountability</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="topbar">
      <h1>Browse Inventory</h1>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-icon"><i class='bx bx-package'></i></div>
        <div>
          <div class="summary-label">Total Items</div>
          <div class="summary-value" id="total-items">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#e8f5e9;color:#2e7d32;"><i class='bx bx-check'></i></div>
        <div>
          <div class="summary-label">Available</div>
          <div class="summary-value" id="available-count">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#fff8e1;color:#b45309;"><i class='bx bx-time-five'></i></div>
        <div>
          <div class="summary-label">Low Stock</div>
          <div class="summary-value" id="low-stock-count">0</div>
        </div>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" data-category="all">All Items</button>
      <button class="tab-btn" data-category="APPARATUS">Apparatus</button>
      <button class="tab-btn" data-category="GLASSWARE">Glassware</button>
      <button class="tab-btn" data-category="EQUIPMENT">Equipment</button>
      <button class="tab-btn" data-category="SUPPLY">Supplies</button>
      <button class="tab-btn" data-category="CHEMICAL">Chemicals</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class='bx bx-search'></i>
        <input type="text" id="search-input" placeholder="Search inventory..." onkeyup="filterInventory()">
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-header-bar">
        <h2>Inventory Items</h2>
        <div class="table-meta" id="table-meta">Showing all items</div>
      </div>
      
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Location</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
