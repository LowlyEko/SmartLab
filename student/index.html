<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLab - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">CASLaboratory</div>
    <div class="nav-menu">
      <a href="index.html" class="active"><i class='bx bx-home'></i> Dashboard</a>
      <a href="reservations.html"><i class='bx bx-calendar'></i> Reservations</a>
      <a href="inventory.html"><i class='bx bx-package'></i> Inventory</a>
      <a href="accountability.html"><i class='bx bx-error-alt'></i> Accountability</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="topbar">
      <h1>Welcome back, <span id="student-name">Student</span>!</h1>
      <div>
        <button onclick="logout()" style="background:none;border:none;color:#c62828;cursor:pointer;margin-right:15px;">Logout</button>
        <span id="profile-name" style="font-weight:600;"></span>
      </div>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-icon"><i class='bx bx-calendar'></i></div>
        <div>
          <div class="summary-label">Pending Reservations</div>
          <div class="summary-value" id="pending-res">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#e8f5e9;color:#2e7d32;"><i class='bx bx-check-circle'></i></div>
        <div>
          <div class="summary-label">Approved</div>
          <div class="summary-value" id="approved-res">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#fdecea;color:#c62828;"><i class='bx bx-error'></i></div>
        <div>
          <div class="summary-label">Accountability</div>
          <div class="summary-value" id="acc-count">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Upcoming Reservations</h2>
      <div id="upcoming-list">Loading...</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
