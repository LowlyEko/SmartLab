<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLab - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body {
      background: #f0f4f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: white;
      width: 420px;
      padding: 45px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo h1 {
      color: #205e38;
      font-size: 32px;
      font-weight: 800;
      margin: 0;
    }
    .login-logo p {
      color: #718096;
      margin: 6px 0 0;
      font-size: 14px;
    }
    .login-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      font-size: 18px;
    }
    .input-wrap input {
      width: 100%;
      padding: 11px 12px 11px 38px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
      outline: none;
    }
    .input-wrap input:focus {
      border-color: #27ae60;
    }
    .eye-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #a0aec0;
      font-size: 18px;
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #205e38;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #174d2e; }
    .btn-login:disabled { background: #a0aec0; cursor: not-allowed; }
    .error-msg {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-note {
      text-align: center;
      color: #a0aec0;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <h1><i class='bx bx-flask' style="font-size:28px; vertical-align:middle;"></i> CASLaboratory</h1>
      <p>Student Portal</p>
    </div>

    <div class="login-title">Sign In</div>

    <div class="error-msg" id="error-msg"></div>

    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class='bx bx-user'></i>
        <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class='bx bx-lock-alt'></i>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        <i class='bx bx-hide eye-toggle' id="eye-toggle"></i>
      </div>
    </div>

    <button class="btn-login" id="login-btn" onclick="handleLogin()">Login</button>

    <div class="footer-note">Forgot password? Contact your laboratory administrator.</div>
  </div>

  <script type="module">
    import { CONFIG } from './js/config.js';

    // Redirect if already logged in
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    if (token) {
      window.location.href = "index.html";
    }

    // Password toggle
    document.getElementById("eye-toggle").addEventListener("click", function () {
      const input = document.getElementById("password");
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      this.className = isHidden ? "bx bx-show eye-toggle" : "bx bx-hide eye-toggle";
    });

    // Enter key support
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });

    window.handleLogin = async function () {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("error-msg");

      errorMsg.style.display = "none";

      if (!username || !password) {
        showError("Please enter your username and password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const res = await fetch(`${CONFIG.BASE_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          const user = data.data.user;

          // Block non-students from student portal
          if (user.user_type !== "STUDENT") {
            showError("This portal is for students only. Please use the admin portal.");
            return;
          }

          localStorage.setItem("token", data.data.token);
          localStorage.setItem("user", JSON.stringify(user));
          window.location.href = "index.html";
        } else {
          showError(data.message || "Invalid username or password.");
        }
      } catch (err) {
        showError("Could not connect to the server. Please try again.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    };

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
