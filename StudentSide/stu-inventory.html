<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLab – Inventory</title>
  <link rel="stylesheet" href="shared/shared.css">
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>
  <nav class="sidebar close">
    <header>
      <div class="image-text">
        <span class="image"><img src="needs/CAS Logo.png" alt="Logo" onerror="this.style.display='none'"></span>
        <div class="text header-text"><div class="brand-name">Smart<span class="name">Lab</span></div></div>
        <i class='bx bx-chevron-right toggle'></i>
      </div>
    </header>
    <div class="menu-bar">
      <div class="menu">
        <ul class="menu-links">
          <li class="nav-link"><a href="student-dashboard.html"><i class="bx bxs-dashboard icon"></i><span class="text nav-text">Dashboard</span></a></li>
          <li class="nav-link"><a href="stu-reservation.html"><i class="bx bx-calendar-check icon"></i><span class="text nav-text">Reservations</span></a></li>
          <li class="nav-link"><a href="stu-inventory.html"><span class="material-symbols-outlined icon">inventory_2</span></i><span class="text nav-text">Inventory</span></a></li>
          <li class="nav-link"><a href="stu-accountability.html"><i class="bx bx-shield icon"></i><span class="text nav-text">Accountability</span></a></li>
        </ul>
      </div>
      <div class="botton-content">
        <li class="mode">
          <div class="moon-sun">
            <i class='bx bx-moon icon moon'></i>
            <i class='bx bx-sun icon sun'></i>
          </div>
          <span class="mode-text text">Dark Mode</span>
          <div class="toggle-switch"><span class="switch"></span></div>
        </li>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="topbar">
      <h1>Browse Inventory</h1>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-icon"><i class='bx bx-package'></i></div>
        <div>
          <div class="summary-label">Total Items</div>
          <div class="summary-value" id="total-items">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#e8f5e9;color:#2e7d32;"><i class='bx bx-check'></i></div>
        <div>
          <div class="summary-label">Available</div>
          <div class="summary-value" id="available-count">0</div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-icon" style="background:#fff8e1;color:#b45309;"><i class='bx bx-time-five'></i></div>
        <div>
          <div class="summary-label">Low Stock</div>
          <div class="summary-value" id="low-stock-count">0</div>
        </div>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" data-category="all">All Items</button>
      <button class="tab-btn" data-category="APPARATUS">Apparatus</button>
      <button class="tab-btn" data-category="GLASSWARE">Glassware</button>
      <button class="tab-btn" data-category="EQUIPMENT">Equipment</button>
      <button class="tab-btn" data-category="SUPPLY">Supplies</button>
      <button class="tab-btn" data-category="CHEMICAL">Chemicals</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class='bx bx-search'></i>
        <input type="text" id="search-input" placeholder="Search inventory...">
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-header-bar">
        <h2>Inventory Items</h2>
        <div class="table-meta" id="table-meta">Showing all items</div>
      </div>
      
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Location</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-tbody"></tbody>
      </table>
    </div>
  </div>
  
  <script src="shared/shared.js"></script>
  <script type="module" src="js/inventory.js"></script>
</body>
</html>
